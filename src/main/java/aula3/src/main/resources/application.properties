spring.application.name=pokemon
server.port=8080

spring.datasource.url=jdbc:h2:mem:pokemondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=

# Permite que o painel do H2 seja renderizado em frames/iframes pelo navegador
spring.h2.console.settings.web-allow-others=true
spring.security.headers.frame-options.disable=true